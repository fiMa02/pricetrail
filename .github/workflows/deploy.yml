name: Публікація сайту

# Ціни збирає scripts/daily.ps1 на домашньому комп'ютері: сайт АТБ (Cloudflare)
# блокує запити з серверів GitHub. Тут лише публікуємо site/ після кожного push.
# Тестова гілка silpo-test публікується поряд, на /test/: її код з даними основного сайту. Публікувати
# дозволено лише з main, тож тестова копія оновлюється з кожною публікацією main (і запуском вручну).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          ref: silpo-test
          path: test-src
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Похідні дані будуємо тут, а не комітимо щодня (вони великі й повністю виводяться з products.json):
      # порівняння міст (data/compare) і спільний каталог (data/cities/*/extra.json).
      - run: node scraper/compare.js && node scraper/fallback.js
      # Тестова копія: сторінка й скрипти з гілки silpo-test у site/test/, дані — спільні (../data),
      # плюс каталоги інших мереж (data/chains) з тієї гілки.
      - name: Тестова копія (/test/)
        run: |
          if [ -d test-src/site ]; then
            mkdir -p site/test
            cp test-src/site/index.html test-src/site/app.js test-src/site/style.css test-src/site/manifest.webmanifest test-src/site/icon* site/test/
            sed -i -E "s#(['\`])data/#\1../data/#g" site/test/app.js
            if [ -d test-src/site/data/chains ]; then cp -r test-src/site/data/chains site/data/; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
