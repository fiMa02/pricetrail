name: Публікація сайту

# Ціни збирає щоденний скрипт на домашньому комп'ютері (сайт АТБ блокує запити з серверів GitHub); він же будує
# похідні дані (порівняння міст, extra.json, catalog.json, categories.json). У репозиторії — лише site/, тут його публікуємо.
# Тестова гілка silpo-test публікується поряд, на /test/: її сторінка з даними основного сайту. Публікувати
# дозволено лише з main, тож тестова копія оновлюється з кожною публікацією main (і запуском вручну).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          ref: silpo-test
          path: test-src
        continue-on-error: true
      # Тестова копія: сторінка й скрипти з гілки silpo-test у site/test/, дані — спільні (../data).
      - name: Тестова копія (/test/)
        run: |
          if [ -d test-src/site ]; then
            mkdir -p site/test
            cp test-src/site/index.html test-src/site/app.js test-src/site/style.css test-src/site/manifest.webmanifest test-src/site/icon* site/test/
            sed -i -E "s#(['\`])data/#\1../data/#g" site/test/app.js
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
