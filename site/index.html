<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Жаба — історія цін</title>
  <meta name="description" content="Жаба — трекер цін у супермаркетах: пошук товарів, графік зміни ціни й перевірка акцій.">
  <meta name="theme-color" content="#f5f6fa">
  <script>
    // Тема: 'light' / 'dark' — вибір користувача, інакше як у системі. Ставимо до першого малювання.
    (function () {
      var dark = matchMedia('(prefers-color-scheme: dark)');
      window.applyTheme = function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        var on = t === 'dark' || (t !== 'light' && dark.matches);
        document.documentElement.dataset.theme = on ? 'dark' : 'light';
        document.querySelector('meta[name=theme-color]').content = on ? '#0c0f14' : '#f5f6fa';
      };
      applyTheme();
      dark.addEventListener('change', applyTheme);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=103">
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <a href="#/" class="logo" aria-label="Жаба — на головну"><img src="icon.svg" alt="" width="32" height="32"><span><b>Жаба</b><small>щоб жаба не душила</small></span></a>
      <div class="top__actions">
        <select id="chainSel" class="chain-pick" aria-label="Мережа" hidden><option value="atb">АТБ</option><option value="silpo">Сільпо</option><option value="thrash">Траш!</option></select>
        <div class="city-pick">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <select id="city" aria-label="Місто"></select>
          <button type="button" class="city-btn" id="cityBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="cityMenu"><span id="cityName"></span><svg class="city-btn__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="city-menu" id="cityMenu" hidden>
            <input type="search" id="cityQ" placeholder="Знайти місто" autocomplete="off" aria-label="Знайти місто" aria-controls="cityList">
            <div class="city-list" id="cityList" role="listbox" aria-label="Місто"></div>
          </div>
        </div>
        <a href="#/settings" class="fav-link" id="settingsLink" aria-label="Налаштування" title="Налаштування"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></a>
        <a href="#/list" class="fav-link cart-link" id="cartLink" aria-label="Список покупок"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span class="fav-link__n cart-link__n" id="cartN" hidden></span></a>
        <a href="#/fav" class="fav-link" id="favLink" aria-label="Обране"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.6-4.7-9.4-9.6C1.4 7.6 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.6 3.1 4.4 6.4-1.8 4.9-9.4 9.6-9.4 9.6Z"/></svg><span class="fav-link__n" id="favN" hidden></span></a>
      </div>
    </div>
    <div class="wrap filters" id="filters">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Знайти товар або бренд" autocomplete="off" aria-label="Пошук товару">
      </label>
      <select id="sort" class="pill sort-pill" aria-label="Сортування">
        <option value="name">За назвою</option>
        <option value="price-asc">Спершу дешевші</option>
        <option value="price-desc">Спершу дорожчі</option>
        <option value="per-kg">Дешевші за 1 кг</option>
        <option value="per-l">Дешевші за 1 л</option>
        <option value="per-pcs">Дешевші за 1 шт</option>
        <option value="discount">Найбільша знижка</option>
      </select>
    </div>
    <details class="wrap fpanel" id="fpanel">
      <summary class="fpanel__head">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <b><span class="hide-sm">Категорії та фільтри</span><span class="show-sm">Фільтри</span></b>
        <span class="fpanel__active" id="fActive"></span>
        <svg class="fpanel__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="fpanel__body">
        <div class="filters__row">
          <select id="group" class="pill" aria-label="Розділ"><option value="">Усі розділи</option></select>
          <select id="cat" class="pill" aria-label="Підкатегорія"><option value="">Усі категорії</option></select>
          <label class="chip-toggle"><input type="checkbox" id="sale"><span>% Акції</span></label>
          <label class="chip-toggle chip-toggle--card"><input type="checkbox" id="card"><span>💳 З карткою АТБ</span></label>
          <label class="chip-toggle chip-toggle--warn" title="Акції, де «ціна до знижки» вища, ніж товар коштував перед акцією"><input type="checkbox" id="inflated"><span>⚠ Завищені акції</span></label>
          <label class="chip-toggle" title="Сховати товари, яких у магазині вибраного міста немає (ціни з іншого міста)"><input type="checkbox" id="local"><span>📍 Тільки у вибраному місті</span></label>
          <button type="button" class="fpanel__reset" id="fReset" hidden>Скинути</button>
        </div>
      </div>
    </details>
  </header>

  <main class="wrap" id="app"></main>
  <button type="button" class="to-top" id="toTop" aria-label="Угору" title="Угору"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

  <footer class="wrap foot">
    <p id="updated"></p>
    <p>Ціни зібрано для одного магазину в кожному місті; в інших магазинах можуть відрізнятися.</p>
  </footer>

  <!-- ?v= — та сама версія, що CACHE у sw.js: старий HTML ніколи не отримає новий скрипт (і навпаки) -->
  <script type="module" src="app.js?v=103"></script>
</body>
</html>
